<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo - Grupo 9</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .contenedor {
            width: 80%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #1565c0;
            font-size: 45px;
            margin-bottom: 5px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .mensaje {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 18px;
        }

        .emoji {
            font-size: 60px;
            animation: mover 1.5s infinite alternate;
        }

        @keyframes mover {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 12px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin: 8px;
            transition: 0.3s;
        }

        button:hover {
            background: #0d47a1;
            transform: scale(1.08);
        }

        #respuesta {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="emoji">👨‍💻👩‍💻</div>

        <h1>¡Hola Mundo!</h1>

        <h2>🚀 Grupo 9 🚀</h2>

        <div class="mensaje">
            💡 Estamos aprendiendo a crear páginas web con
            <strong>HTML, CSS y JavaScript.</strong>
        </div>

        <p>¿Quieres ver algo interactivo?</p>

        <button onclick="saludar()">👋 Saludar</button>

        <button onclick="aprender()">💻 Aprender</button>

        <button onclick="equipo()">🤝 Grupo 9</button>

        <div id="respuesta"></div>

    </div>

    <script>

        function saludar() {
            document.getElementById("respuesta").innerHTML =
            "👋 ¡Hola Mundo desde el Grupo 9!";
        }

        function aprender() {
            document.getElementById("respuesta").innerHTML =
            "📚 HTML crea la estructura, CSS diseña y JavaScript agrega interacción.";
        }

        function equipo() {
            document.getElementById("respuesta").innerHTML =
            "🚀 ¡Somos el Grupo 9 aprendiendo desarrollo web!";
        }

    </script>

</body>
</html>
